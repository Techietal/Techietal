## Save this file at:  .github/workflows/snake.yml
## It regenerates the contribution "snake" SVGs every night and on demand,
## then pushes them to a branch called `output`, which the README reads from.

name: Generate Contribution Snake

on:
  schedule:
    # runs every day at 00:00 UTC
    - cron: "0 0 * * *"
  # lets you run it manually from the Actions tab
  workflow_dispatch:
  # also refreshes whenever you push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=b23b1e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=e06a45

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}