name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Techietal
          outputs: |
            assets/github-snake.svg?color_snake=#00E5FF&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#00E5FF

      - name: Commit generated snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Generate contribution snake
          file_pattern: assets/github-snake.svg assets/github-snake-dark.svg